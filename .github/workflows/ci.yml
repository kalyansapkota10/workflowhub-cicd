name: WorkFlowHub CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # Job 1: Test Django Backend
  backend-tests:
    name: Django Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate temporary Django secret key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Check Django configuration
        run: python backend/manage.py check

      - name: Run Django automated tests
        run: python backend/manage.py test tasks


  # Job 2: Check React Frontend
  frontend-checks:
    name: React Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build React application
        working-directory: frontend
        run: npm run build


  # Job 3: Build Docker Images
  docker-builds:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Django Docker image
        run: docker build -t workflowhub-backend:ci ./backend

      - name: Build React Docker image
        run: docker build -t workflowhub-frontend:ci ./frontend